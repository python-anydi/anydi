name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Code quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.10'
          enable-cache: true
      - name: Set up Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --all-extras --dev
      - name: Static type checking
        run: uv run ty check
      - name: Code formatting
        run: uv run ruff check && uv run ruff format --check
      - name: Documentation
        run: |
          uv run python tools/lint_docs.py
          uv run --group docs mkdocs build --strict

  tests:
    name: Run unit tests ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: '3.14', python: '3.14', os: ubuntu-latest}
          - {name: '3.13', python: '3.13', os: ubuntu-latest}
          - {name: '3.12', python: '3.12', os: ubuntu-latest}
          - {name: '3.11', python: '3.11', os: ubuntu-latest}
          - {name: '3.10', python: '3.10', os: ubuntu-latest}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install dependencies
        run: uv sync --all-extras --dev
      - name: Run tests
        run: |
          uv run pytest -vv tests --cov=anydi
          uv run pytest -vv tests/ext/test_pytest_plugin.py --cov=anydi --cov-append --cov-report=xml -p anydi -p pytester
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        if: matrix.python == '3.10'

  floors:
    name: Run unit tests on the oldest dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.10'
          enable-cache: true
      - name: Install the oldest dependencies
        run: uv sync --all-extras --dev --resolution lowest-direct --upgrade
      - name: Run tests
        run: uv run --no-sync pytest tests

  upstream:
    name: Run unit tests on anyio main
    runs-on: ubuntu-latest
    # The pytest plugin uses two helpers `anyio` keeps out of its public API,
    # and it loads in every test run of everyone who installs `anydi`.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
          enable-cache: true
      - name: Install dependencies
        run: uv sync --all-extras --dev
      - name: Take anyio from main
        run: uv pip install --upgrade "anyio @ git+https://github.com/agronholm/anyio"
      - name: Run tests
        run: |
          uv run --no-sync pytest tests
          uv run --no-sync pytest tests/ext/test_pytest_plugin.py -p anydi -p pytester

  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.10'
          enable-cache: true
      - name: Set up Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --all-extras --dev
      - name: Run benchmarks
        uses: CodSpeedHQ/action@v4.5.1
        with:
          mode: simulation
          run: uv run pytest tests/test_benchmarks.py --codspeed
